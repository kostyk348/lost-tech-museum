body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}

.note{background:#101720;border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:var(--mut);font-size:14px}
.note b{color:var(--fg)}
code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#111722;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
